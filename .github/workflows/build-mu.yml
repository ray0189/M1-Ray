name: Build BOOTAA64.EFI (Apple Silicon UEFI)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 uuid-dev acpica-tools nasm clang lld

      # Make sure any https://github.com/* submodule pulls use the CI token
      - name: Configure git token for all GitHub clones
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone AppleWOA Project-Mu (no recurse yet)
        run: |
          set -e
          git clone https://github.com/AppleWOA/apple_silicon_platforms_mu.git
          cd apple_silicon_platforms_mu

          # --- HOT PATCH: fix dead submodule Zeex/subhook to a live fork (kubo/subhook) ---
          if grep -R "Zeex/subhook.git" -n MU_BASECORE/.gitmodules; then
            sed -i 's|https://github.com/Zeex/subhook.git|https://github.com/kubo/subhook.git|g' MU_BASECORE/.gitmodules
          fi

          # sync submodule URLs after the patch
          git submodule sync --recursive

      - name: Init submodules (recursive)
        working-directory: apple_silicon_platforms_mu
        run: |
          set -e
          git submodule update --init --recursive --jobs 8

      - name: Build BOOTAA64.EFI (attempt)
        id: build1
        working-directory: apple_silicon_platforms_mu
        continue-on-error: true
        run: |
          make -C Platforms/Apple/Silicon
          find . -name BOOTAA64.EFI -print -exec cp {} $GITHUB_WORKSPACE/BOOTAA64.EFI \;

      - name: Retry submodules & build (fallback)
        if: steps.build1.outcome != 'success'
        working-directory: apple_silicon_platforms_mu
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          make -C Platforms/Apple/Silicon
          find . -name BOOTAA64.EFI -print -exec cp {} $GITHUB_WORKSPACE/BOOTAA64.EFI \;

      - name: Ensure Latest Release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload BOOTAA64.EFI to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: BOOTAA64.EFI
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
